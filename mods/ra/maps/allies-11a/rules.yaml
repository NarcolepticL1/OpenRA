World:
	LuaScript:
		Scripts: allies11a.lua, allies11a-AI.lua, campaign.lua, utils.lua
	MissionData:
		Briefing: briefing
		BriefingVideo: ally11.vqa
		StartVideo: destroyr.vqa
		WinVideo: shorbomb.vqa
		LossVideo: shipsink.vqa
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal
	TimeLimitManager:
		CountdownLabel: MISSION_TEXT
		CountdownText: Cruisers arrive in {0}
		Notification: {0} minute{1} remaining
		SkipTimerExpiredNotification: True

