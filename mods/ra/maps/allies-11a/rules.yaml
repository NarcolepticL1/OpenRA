# TODO Remove range testing stuff. This was for placing and testing proximities.
^GainsExperience:
	ExternalCondition@RANGETESTER:
		Condition: pinged-by-tester
	WithColoredOverlay@RANGETESTED:
		RequiresCondition: pinged-by-tester

^RangeTester:
	WithRangeCircle:
		Range: 10c0
		Visible: Always 
		Color: FF0000
	SpeedMultiplier:
		Modifier: 500
	ProximityExternalCondition@RANGETESTER:
		Condition: pinged-by-tester
		Range: 10c0

MH60:
	Inherits@Tester: ^RangeTester

HELI:
	Inherits@Tester: ^RangeTester
	WithRangeCircle:
		Range: 12c0
		Color: 00FF00
	ProximityExternalCondition@RANGETESTER:
